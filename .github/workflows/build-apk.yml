name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        # Provisiona o Gradle diretamente (versão estável mais recente), sem
        # depender de um gradlew/wrapper versionado no repositório.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: treinoia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
