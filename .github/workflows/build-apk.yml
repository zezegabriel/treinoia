name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar Gradle wrapper
        # O runner do GitHub já vem com um Gradle recente instalado; usamos ele
        # para gerar o wrapper (gradlew) do projeto, já que não versionamos o
        # gradle-wrapper.jar (binário) manualmente.
        run: gradle wrapper

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: treinoia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
